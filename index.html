<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80-Day Fitness Dashboard - Rithesh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f3ee;
            color: #2c2c2a;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border: 0.5px solid #d3d1c7;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888780;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 500;
        }
        
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
            border-bottom: 0.5px solid #d3d1c7;
            padding-bottom: 1rem;
        }
        
        .tab-button {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #888780;
        }
        
        .tab-button.active {
            background: #2c2c2a;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .workout-card {
            background: white;
            padding: 1.25rem;
            border-radius: 12px;
            border: 0.5px solid #d3d1c7;
            margin-bottom: 1rem;
        }
